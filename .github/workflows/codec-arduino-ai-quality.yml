name: CodeCram Arduino AI project quality

on:
  push:
    branches:
      - feat/codecra-m-growth-system
    paths:
      - "youtube/episode-002-arduino-ai/**"
      - ".github/workflows/codec-arduino-ai-quality.yml"
  pull_request:
    paths:
      - "youtube/episode-002-arduino-ai/**"
      - ".github/workflows/codec-arduino-ai-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube/episode-002-arduino-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube/episode-002-arduino-ai/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
