services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_password}
    volumes: [sentinel_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      ml: {condition: service_started}
  ml:
    build: ./ml-engine
    ports: ["8001:8001"]
    volumes: [ml_models:/app/models]
  web:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
  simulator:
    build: ./simulator
    environment:
      SENTINEL_API_URL: http://api:8000
      SENTINEL_INGEST_API_KEY: ${SENTINEL_INGEST_API_KEY:-local-demo-ingest-key-change-me}
      SIMULATOR_INTERVAL_SECONDS: 3
    depends_on: [api]
    profiles: [demo]
volumes:
  sentinel_pg:
  ml_models:
