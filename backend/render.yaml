services:
  - type: web
    name: tiktok-monitor-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CORS_ORIGIN
        value: https://frontend-lake-xi-51.vercel.app,https://hichem.app
      - key: DEFAULT_KEYWORDS
        value: giveaway,discount,order,interested,price
      - key: PHONE_MIN_DIGITS
        value: "8"
      - key: PHONE_MAX_DIGITS
        value: "15"
      - key: RECONNECT_MAX_ATTEMPTS
        value: "5"
      - key: RECONNECT_DELAY_MS
        value: "4000"
      - key: CONNECT_TIMEOUT_MS
        value: "20000"
      - key: LOG_LEVEL
        value: info
