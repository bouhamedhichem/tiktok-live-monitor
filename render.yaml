# Render Blueprint — deploys both services in one step.
#
# In the Render dashboard: New + -> Blueprint -> select this repo.
# Render reads this file automatically because it's named render.yaml.
#
# Service names below become part of the public URL Render assigns
# (e.g. "tiktok-monitor-backend" -> https://tiktok-monitor-backend.onrender.com).
# Names must be globally unique on Render — if either is already taken,
# rename it here (and in the matching fromService reference below) before
# deploying, or rename it in the dashboard and update the two env vars
# it's wired to afterwards.
#
# Free plan notes (see README.md "Deploying" section for details):
#  - both services spin down after 15 minutes idle; the next request wakes
#    them up in ~30-60s
#  - the backend's filesystem is wiped on every restart/redeploy, which
#    resets the comment/lead history — export before a long idle period

services:
  - type: web
    name: tiktok-monitor-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: tiktok-monitor-frontend
          property: host
      - key: DEFAULT_KEYWORDS
        value: giveaway,discount,order,interested,price
      - key: PHONE_MIN_DIGITS
        value: "8"
      - key: PHONE_MAX_DIGITS
        value: "15"
      - key: RECONNECT_MAX_ATTEMPTS
        value: "5"
      - key: RECONNECT_DELAY_MS
        value: "4000"
      - key: CONNECT_TIMEOUT_MS
        value: "20000"
      - key: LOG_LEVEL
        value: info

  - type: web
    name: tiktok-monitor-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tiktok-monitor-backend
          property: host
